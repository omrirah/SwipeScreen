<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="description" content="Systematic review screening with swipe gestures" />
    <title>SwipeScreen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // '%MODE%' is replaced by Vite at serve/build time. The service worker
      // is production-only: on the dev server its cache-first strategy would
      // cache Vite's transformed modules and keep serving stale code after
      // source edits. In dev, actively remove any previously installed worker
      // and its caches so an already-poisoned browser heals on next reload.
      if ('serviceWorker' in navigator) {
        if ('%MODE%' === 'production') {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
          });
        } else {
          navigator.serviceWorker.getRegistrations()
            .then((regs) => regs.forEach((r) => r.unregister()))
            .catch(() => {});
          if (window.caches) {
            caches.keys()
              .then((keys) => keys.forEach((k) => caches.delete(k)))
              .catch(() => {});
          }
        }
      }
    </script>
  </body>
</html>
